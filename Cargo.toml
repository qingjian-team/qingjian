[workspace]
resolver = "3"
members = [
    "crates/qingjian-core",
    "crates/qingjian-dictionary",
    "crates/qingjian-translate",
    "crates/qingjian-learning",
    "crates/qingjian-platform",
    "crates/qingjian-predict",
    "crates/qingjian-lm",
    "crates/qingjian-format",
    "crates/qingjian-neural",
    "crates/qingjian-render",
    "apps/cli", "apps/macos", "apps/windows/server", "apps/windows/tsf", "apps/windows/settings", "apps/linux/host", "tools/dict-convert", "tools/gloss-gen",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/qingjian-team/qingjian"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# 内部 crate
qingjian-core = { path = "crates/qingjian-core" }
qingjian-dictionary = { path = "crates/qingjian-dictionary" }
qingjian-translate = { path = "crates/qingjian-translate" }
qingjian-learning = { path = "crates/qingjian-learning" }
qingjian-platform = { path = "crates/qingjian-platform" }
qingjian-predict = { path = "crates/qingjian-predict" }
qingjian-lm = { path = "crates/qingjian-lm" }
qingjian-format = { path = "crates/qingjian-format" }
qingjian-neural = { path = "crates/qingjian-neural" }
qingjian-render = { path = "crates/qingjian-render" }

# 外部依赖统一在这里定版本，子 crate 一律 `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dotenvy = "0.15.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = "0.25"
# 快捷候选的日期 / 时间（本地时区）
jiff = "0.2.35"
plist = "1.7"
# 热路径上的字符串键哈希表（词频 / 语言模型 / 个人 n-gram）：SipHash 一次查表几十纳秒，单字母简拼一键要查几万次
foldhash = "0.2.0"
# 繁体输出（OpenCC s2tw，内置词表）；只要简→繁那半
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["s2t-conversion"] }
# .qj 数据容器：mmap 打开、结构体数组零拷贝读取
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

# 本地神经语言模型推理（字级 Transformer，权重 safetensors）
candle-core = "0.11.0"
candle-nn = "0.11.0"

# 云联想：OpenAI 兼容接口客户端与它需要的异步运行时
async-openai = { version = "0.42.0", default-features = false, features = ["chat-completion", "native-tls"] }
reqwest = { version = "0.13", default-features = false }
uuid = { version = "1.26", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt", "time"] }

# 自绘渲染器：CPU 栅格 + 文字整形/回退/栅格（fontdb / rustybuzz / swash）
tiny-skia = "0.12.0"
# 不开 fontconfig：不扫系统字体库，字体文件由渲染器按平台清单自己加载
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
png = "0.18.1"

# macOS 平台层
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSAttributedString", "NSEvent", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPasteboard", "NSSavePanel", "NSCell", "NSFontManager", "NSPopUpButton", "NSPopover", "NSSearchField", "NSSearchFieldCell", "NSViewController", "NSTextField", "NSSecureTextField", "NSTextFieldCell", "NSActionCell", "NSRunningApplication", "NSAppearance", "NSText", "NSButton", "NSButtonCell", "NSControl", "NSStringDrawing", "NSTabView", "NSTabViewItem", "NSView", "NSWindow", "NSScrollView", "NSClipView", "NSTextView", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableHeaderCell", "NSParagraphStyle", "block2"] }
objc2-input-method-kit = "0.3.2"
# 候选窗字体设置：按字族名找字体文件（渲染器只加载指定文件）
objc2-core-text = { version = "0.3.2", features = ["CTFont", "CTFontDescriptor"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFSet", "CFString", "CFURL"] }

# Windows 平台层
embed-manifest = "1.4.0"
windows-registry = "0.6.1"

# cosmic-text 加了 opsz 光学字号支持（FontSystem::set_optical_size），补丁在 qingjian-team 的 fork，分支 qingjian-opsz 基于 0.19.0；
# 上游收了就删掉这段回 crates.io。见 docs/design/rendering.md
[patch.crates-io]
cosmic-text = { git = "https://github.com/qingjian-team/cosmic-text", rev = "9cf0d65a5e4db381e34907103326673386096be3" }

[package]
name = "qingjian-render"
description = "自绘渲染器：把候选窗一帧画成位图，各平台只负责贴图"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tiny-skia.workspace = true
# 主题里的 SVG 图片：解析 + 栅格到 tiny-skia 位图（与上面同一个 tiny-skia）；不要 SVG 文字、系统字体与内嵌位图解码
resvg = { version = "0.48.1", default-features = false }
cosmic-text.workspace = true
zeno.workspace = true
thiserror.workspace = true
tracing.workspace = true
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# 字体登记走 DirectWrite（按字族名找文件、列字族）
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }

[dev-dependencies]
clap.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

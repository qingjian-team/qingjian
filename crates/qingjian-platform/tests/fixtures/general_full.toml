# Golden fixture：覆盖全部 64 个 `[general]` 键，用于配置拆分前后的等价性回归。
# 值尽量取非缺省；旧键（wubi / shuangpin / zhuyin / traditional）写成 Some，验证旧写法照样读得进。
# 改这个文件前先看 tests/config_golden.rs：键集合必须仍是 64 个，一个不多一个不少。

[general]
learning_language = "ja"
translation_pos = false
show_tones = true
page_size = 5
page_keys = ",."
appearance = "dark"
theme = "sakura"
layout = "horizontal"
horizontal_grid = true
grid_page_keys = true
vertical_reverse_above = true
renderer = "system"
font = "LXGW WenKai"
candidate_font_size = 20
annotation_font_size = 13.5
candidate_font_weight = 500
animations = false
preedit = "window"
english_candidates = false
chinese_first = true
spelling_correction = false
english_in_chinese = false
english_max_in_chinese = 2
english_min_position = 3
show_english_pronunciation = true
emoji = 2
kaomoji = 2
symbols = 2
auto_space = true
shift_letter = "compose"
numpad_digit = "direct"
english_mode = false
default_english = true
remember_mode_per_app = true
double_shift_input = "vietnamese"
full_width_punctuation = false
english_full_width_punctuation = true
pair_punctuation = false
english_pair_punctuation = true
half_width_symbols = "`"
punct_commits = true
aux_code_key = "/"
aux_code_show = true
aux_code_keep_empty = false
scheme = "xiaohe"
shuangpin_raw_preedit = true
shuangpin_raw_window = true
shuangpin_full_pinyin = true
hold_selections = false
key_hint = "always"
key_hint_opacity = 60
key_hint_size = 120
code = "wubi86"
wubi = "wubi86"
shuangpin = "xiaohe"
zhuyin = true
traditional_variant = "hongkong"
traditional = true
last_traditional = "taiwan"
ui_language = "vi"
log_level = "debug"
input_log = false
learning = false
system_text_replacements = false

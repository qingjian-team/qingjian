[package]
name = "qingjian-clipboard-app"
description = "青简剪贴板：全局快捷键呼出的剪贴板历史面板，可单独使用，也可由输入法的设置打开"
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "qingjian-clipboard"
path = "src/main.rs"

[dev-dependencies]
resvg = { version = "0.49", default-features = false }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[target."cfg(windows)".dependencies]
bamboo-slip = { workspace = true, features = ["host"] }
bamboo-slip-i18n.workspace = true
qingjian-clipboard.workspace = true
qingjian-clipboard-sync.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
arboard = { workspace = true, features = ["image-data"] }
qingjian-code.workspace = true
jiff.workspace = true
tracing.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "qingjian-tsf"
description = "Windows 输入法的 TSF 文本服务 DLL：加载进每个应用进程，把系统按键经 IPC 交给 Server 进程，画候选窗口"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# TSF 文本服务是被 Windows 加载的 COM in-proc 服务器，产物是 DLL（cdylib）；
# 同时给出 rlib 以便端到端协议测试能 `use qingjian_tsf`（DLL 里的引擎层=管道客户端，可测）。
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core.workspace = true
qingjian-platform.workspace = true
thiserror.workspace = true

[dev-dependencies]
qingjian-windows = { path = "../windows" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
windows-core = "0.62.2"

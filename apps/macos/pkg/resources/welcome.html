h2 { font-size: 15px; margin: 0 0 10px; }
p { margin: 0 0 8px; line-height: 1.5; }

<h2>青简 —— 学外语的拼音输入法</h2>
<p>这是测试版。安装后会把「青简」加进系统的输入法列表并自动启用，之后在输入法菜单里切换即可。</p>
<ul>
<li>候选词右侧显示词性与译文（英文或日文，可在偏好设置里改），拼音、词库、学习全部离线。</li>
<li>不上传任何数据。云联想默认关闭；打开后只把当前拼音发给你自己填写的 AI 服务商。</li>
<li>用户词频与配置保存在「~/资源库/Application Support/Qingjian/」，输入日志只写本机，用于离线评测，可在偏好设置里关闭或清空。</li>
</ul>
<p>安装到「/资源库/Input Methods/」，需要管理员密码。</p>
</body></html>

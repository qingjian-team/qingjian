<!DOCTYPE html>
<html lang="zh-Hans"><head><meta charset="utf-8"><style>
body { font: 13px -apple-system, "PingFang SC", sans-serif; color: #222; margin: 12px; }
h2 { font-size: 15px; margin: 0 0 10px; }
p { margin: 0 0 8px; line-height: 1.5; }
ol, ul { margin: 0 0 8px 18px; padding: 0; line-height: 1.5; }
code { font: 12px Menlo, monospace; }
</style></head><body>
<h2>安装完成</h2>
<p>点菜单栏的输入法图标，选「青简」就能用了。</p>
<p>如果列表里没有：</p>
<ol>
<li>系统设置 → 键盘 → 输入法 → 编辑… → 左下角「+」→ 简体中文 → 青简。</li>
<li>还没有的话注销再登录一次，系统会重新扫描输入法目录。</li>
</ol>
<p>偏好设置在输入法菜单里；卸载运行 <code>/Library/Input\ Methods/Qingjian.app/Contents/Resources/uninstall.sh</code>（加 <code>--purge</code> 连学习数据一起删）。</p>
<p>遇到问题请把「~/资源库/Logs/Qingjian/」里当天的日志和偏好设置「关于」页复制的诊断信息发给作者。</p>
</body></html>

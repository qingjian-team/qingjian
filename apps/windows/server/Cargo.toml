[package]
name = "qingjian-windows-server"
description = "Windows 输入法的 Server 进程：持有 Engine，跑在应用进程外，与 TSF DLL（../tsf）走 IPC 协议通信"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-server"
path = "src/main.rs"

# 构建期把 uiAccess=true manifest 嵌进 exe（见 build.rs）。宿主平台跑，非 Windows 宿主上 build.rs 里按 CARGO_CFG_WINDOWS 跳过。
[build-dependencies]
embed-manifest.workspace = true

[dependencies]
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-lm.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-translate.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 按天滚动的日志文件（%APPDATA%\Qingjian\logs），与 stderr 同时写；留最近几天。
tracing-appender.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # 命名管道安全描述符（放行 UWP/AppContainer 客户端）。
    "Win32_Security",
    "Win32_Security_Authorization",
] }
# 候选窗口在 Server 进程内自绘（GDI 分层窗口 + 消息循环），才能盖过微软商店 / 任务栏搜索这些高 z-band 宿主。
# 用高层 `windows` crate（与 旧 TSF DLL 的候选窗口渲染同一套代码）。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

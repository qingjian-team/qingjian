[package]
name = "qingjian-windows-tsf"
description = "Windows 输入法的 TSF 文本服务 DLL：加载进每个应用进程，把系统按键经 IPC 交给 Server 进程（../server）"
version = "0.3.6-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# cdylib 是产物 qingjian_tsf.dll（regsvr32 与安装脚本都认这个名字）；rlib 给端到端协议测试 `use qingjian_tsf`。
[lib]
name = "qingjian_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core.workspace = true
qingjian-platform.workspace = true
# 系统界面宿主里的进程内候选窗自己用 GDI 画（`com::candidates::paint`），不链渲染库：
# 这个 DLL 会被加载进每个应用进程，带上整套渲染库不划算。
thiserror.workspace = true

[dev-dependencies]
qingjian-windows-server = { path = "../server" }
# `window_renders_a_candidate_frame` 把窗口截图存成 PNG，人工看一眼画出来的候选长什么样。
png = "0.18"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-registry.workspace = true
# `#[implement]` 宏展开引用 `::windows_core`，要直接依赖
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    # 冒烟测试用 PrintWindow 给候选窗截个图（这个绑定在 windows crate 里归在 Storage::Xps 下）；
    # 只有 `#[cfg(test)]` 的代码用，不进 DLL。
    "Win32_Storage_Xps",
] }

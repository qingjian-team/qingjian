[package]
name = "qingjian-linux-server"
description = "Linux Fcitx5 输入法的 Rust Server"
version = "0.3.6-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-linux-server"
path = "src/main.rs"

[dependencies]
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-lm.workspace = true
qingjian-neural.workspace = true
qingjian-platform.workspace = true
qingjian-translate.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc = "0.2.189"
qingjian-predict.workspace = true

# 日志文件只在 Server 本体（Linux / FreeBSD）里开
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

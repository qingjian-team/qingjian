SPDX-FileCopyrightText = "青简贡献者"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-Qingjian-Commercial"

[[annotations]]
path = "crates/qingjian-render/themes/**"
precedence = "closest"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "青简贡献者"
SPDX-License-Identifier = "GPL-3.0-or-later"

# 双许可的两个 crate；themes/ 只以 GPL 发布，下面单独覆盖

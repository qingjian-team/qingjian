name: 报告问题
description: 功能不正常、崩溃、行为与文档不符
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        标题请用一句话写清现象，例如「Windows 记事本里敲 v 进不了表达式模式」。

        感谢反馈。请尽量填全，尤其是复现步骤和版本号，能省去来回追问的时间。
        提交后维护者会补上平台（`os: *`）、模块（`area: *`）、优先级和贡献友好等维护标签，不必自己操心。标签规则见 [Issue 维护标签指南](../ISSUE_LABELS.md)。
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 issue（包括已关闭的），没有重复
          required: true
        - label: 已查过[使用说明](https://qingjian.app/docs)，里面没有答案
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 几个平台都出现就都选上
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - Android
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 系统版本
      description: 例如 macOS 26.1、Windows 11 24H2、Windows 10 22H2；Linux 写发行版与输入法框架（Ubuntu 26.04 + Fcitx5）；Android 写系统与机型（HyperOS 2 / Android 15，小米 14）
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: qingjian_version
    attributes:
      label: 青简版本
      description: 「设置 → 关于」页里的版本号，或下载的安装包文件名；几个平台版本不同时分别写
      placeholder: 0.3.5
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 出问题时所在的应用
      description: 如果只在某些应用里出现，写出应用名和版本；所有应用都出现就写「全部」
      placeholder: 企业微信 4.1.x / Visual Studio Code / 全部
  - type: dropdown
    id: schema
    attributes:
      label: 输入方案
      multiple: true
      options:
        - 全拼
        - 双拼
        - 九宫格
        - 五笔
        - 注音
        - 日语
        - 英文
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，包括敲了哪些键。能稳定复现请注明；偶发的也请写大致频率。
      placeholder: |
        1. 切到青简，在记事本里输入 v1+2
        2. 预期出现 3，实际……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可以贴截图或录屏。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 运行日志
      description: |
        电脑上点「设置 → 高级 → 日志文件 → 打包到桌面」，把桌面上的 zip 拖进来作为附件；Android 上是青简 App 的「数据 → 日志 → 打包日志」，选「存到手机」再传上来。
        包里带了版本、系统与设置，密钥会被抹去；缺省不含打的字。详见 https://qingjian.app/docs/help/feedback 。
        贴不了附件时，可以把当天日志里出问题那段贴在这里。
      render: text

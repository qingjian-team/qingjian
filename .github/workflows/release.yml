# 推 macos-v<版本> / windows-v<版本> 标签触发（各平台壳版本号独立：macOS 读 apps/macos/Cargo.toml，Windows 读 apps/windows/server/Cargo.toml），
# 流程见 docs/notes/release.md。macOS 的签名与公证可选，下面的 Secrets 配齐才签，否则出 ad-hoc 包；
# Windows 现在没有代码签名（QINGJIAN_UIACCESS=0 关掉 uiAccess，否则没签名的 Server 起不来），证书办下来再加 signtool。
#   QINGJIAN_CERT_P12            Developer ID Application + Installer 两张证书（含私钥）导出的 .p12，base64
#   QINGJIAN_CERT_PASSWORD       .p12 的密码
#   QINGJIAN_SIGN_IDENTITY       "Developer ID Application: 名字 (TEAMID)"
#   QINGJIAN_INSTALLER_IDENTITY  "Developer ID Installer: 名字 (TEAMID)"
#   QINGJIAN_NOTARY_KEY          App Store Connect API 密钥 .p8，base64
#   QINGJIAN_NOTARY_KEY_ID       密钥的 Key ID
#   QINGJIAN_NOTARY_ISSUER       密钥的 Issuer ID
# 发版后让官网重新构建（也可选）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，对 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据从滚动的 data Release 下载，按它的 SHA256SUMS 校验并记进 build-info.json。
name: release

on:
  push:
    tags: ['macos-v*', 'windows-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: startsWith(github.ref_name, 'macos-v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bundle.sh 用提交数当构建号；门禁要看 main
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "sign=${{ secrets.QINGJIAN_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notarize=${{ secrets.QINGJIAN_NOTARY_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/macos/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#macos-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/macos/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated
          gh release download data --pattern qingjian-data.tar.gz --pattern SHA256SUMS --dir data
          (cd data && grep 'qingjian-data.tar.gz' SHA256SUMS | shasum -a 256 -c -)
          echo "DATA_SHA256=$(shasum -a 256 data/qingjian-data.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar -xzf data/qingjian-data.tar.gz -C data/generated
          # 解出来的 mtime 是打包时的，比 checkout 出来的 TSV 旧，bundle.sh 会以为要重打；统一刷新
          find data/generated -type f -exec touch {} +
          ls -la data/generated data/generated/dicts

      - name: Import signing certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.QINGJIAN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.QINGJIAN_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.QINGJIAN_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.QINGJIAN_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "QINGJIAN_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "QINGJIAN_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.QINGJIAN_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.QINGJIAN_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.QINGJIAN_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qingjian --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "QINGJIAN_NOTARY_PROFILE=qingjian" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        run: QINGJIAN_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Build pkg (x86_64)
        run: QINGJIAN_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Checksums and build info
        run: |
          cd target/pkg
          shasum -a 256 ./*.pkg | tee SHA256SUMS
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "macOS $(sw_vers -productVersion)" --arg data_sha256 "$DATA_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_sha256: $data_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.secrets.outputs.sign }}
        run: |
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ "$SIGNED" != "true" ]]; then
            printf '\n> 这一版没有 Apple 开发者签名，首次打开系统会拦一下：到「系统设置 → 隐私与安全性」底部点「仍要打开」再装一次。\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" --title "青简 $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/pkg/*.pkg target/pkg/SHA256SUMS target/pkg/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/pkg

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh release

  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # 没有代码签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来）。证书办下来后去掉这一行并在 build.ps1 加 signtool。
      QINGJIAN_UIACCESS: '0'
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/windows/server/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#windows-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/windows/server/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated
          gh release download data --pattern qingjian-data.tar.gz --pattern SHA256SUMS --dir data
          (cd data && grep 'qingjian-data.tar.gz' SHA256SUMS | sha256sum -c -)
          echo "DATA_SHA256=$(sha256sum data/qingjian-data.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar -xzf data/qingjian-data.tar.gz -C data/generated
          ls -la data/generated data/generated/dicts

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Checksums and build info
        run: |
          cd target/installer
          sha256sum ./*.exe | tee SHA256SUMS
          RUNNER_OS_NAME="$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')"
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "$RUNNER_OS_NAME" --arg data_sha256 "$DATA_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_sha256: $data_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          printf '\n> 内测版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "青简 Windows $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/installer/*.exe target/installer/SHA256SUMS target/installer/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/installer

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh release

# docs/user 改了就让官网重新构建（它的「文档」页从这里拉）：往官网仓库推一个小提交，Cloudflare 见到提交就构建。
# 需要 Secret QINGJIAN_WEB_TOKEN，见 release.yml。
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/user/**']
  # 手动触发：想让官网现在就重建时在 Actions 页点一下（或 gh workflow run docs.yml）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trigger website build
        env:
          # 没配 token 时脚本自己跳过（secrets 不能写在 if 里）
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: |
          if [[ -z "$QINGJIAN_WEB_TOKEN" ]]; then echo "没配 QINGJIAN_WEB_TOKEN，跳过"; exit 0; fi
          tools/release/bump-website.sh docs

# docs/user 改了就让官网重新构建（它的「文档」页从这里拉）：往官网仓库推一个小提交，Cloudflare 见到提交就构建。
# 需要 Secret QINGJIAN_WEB_TOKEN，见 release.yml。
name: docs

on:
  push:
    branches: [main]
    paths: ['docs/user/**']
  # 手动触发：想让官网现在就重建时在 Actions 页点一下（或 gh workflow run docs.yml）
  workflow_dispatch:

env:
  WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger website build
        if: env.WEB_TOKEN != ''
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh docs

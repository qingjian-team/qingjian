# 质量趋势、文档链接、feature 组合与 release 测试。
# 与 ci.yml 互补：那边管“编得过、测试过、依赖合规”，这里管“坏写法不增长、文档不断链、
# feature 组合不炸、release 下行为一致”。所有 action 与 ci.yml 一样钉 commit。
name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 纯 Python、秒级：新 PR 里多一个 unwrap/unsafe/todo!，这里第一眼就红。
  code-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quality baseline
        run: python3 tools/ci/quality_gate.py

      # 手机壳的 Kotlin 没有 cargo 那套 lint 门，单独钉住 !! / @Suppress / TODO 的存量。
      - name: Kotlin baseline
        run: python3 tools/ci/kotlin_gate.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: target/quality-report.md
          if-no-files-found: ignore

  # 文档改名/删文件后，站内链接不会自己报错；构建时也不一定检查相对路径。
  docs-links:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docs links
        run: python3 tools/ci/check_docs_links.py

  # 默认 native-tls、安卓 rustls，两条路径单独都有 job；同时打开两者没有。
  # async-openai / reqwest 的 feature 组合冲突只会在“都开”时暴露。
  features:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Check all features
        run: cargo check -p qingjian-predict --all-features --locked

  # 门禁脚本本身也要有测试：改脚本时不能把“该报的没报、不该报的报了”带进 CI。
  tools-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test CI tools
        run: python3 -m unittest discover -s tools/ci/tests -v

  # debug_assert! 在 release 下消失，它引用的变量会变成未使用；#[cfg(debug_assertions)]
  # 两侧的模块更是两份代码。现有的 release job 只跑 clippy，不跑测试。
  release-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Test core crates (release profile)
        run: cargo test --release -p qingjian-core -p qingjian-format -p qingjian-dictionary -p qingjian-learning --locked

  # 体积不设阈值（每次改动都会波动），只把 release Server 的 top 20 贴到 job summary，
  # 合并 PR 前看一眼是谁把体积吃掉了。独立 job，不进 summary，失败也不挡合并。
  binary-size:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      - name: Report release binary size
        run: |
          {
            echo '## Linux Server 体积（cargo-bloat 前 20）'
            echo '```'
            cargo bloat --release --locked -p qingjian-linux-server -n 20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # 五个质量 job 的聚合状态：分支保护只需要挂这一个 check，不会漏挂。
  summary:
    needs: [code-quality, docs-links, features, tools-tests, release-tests]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All quality jobs passed
        run: |
          for result in \
            "${{ needs.code-quality.result }}" \
            "${{ needs.docs-links.result }}" \
            "${{ needs.features.result }}" \
            "${{ needs.tools-tests.result }}" \
            "${{ needs.release-tests.result }}"
          do
            if [ "$result" != "success" ]; then
              echo "quality job result: $result" >&2
              exit 1
            fi
          done
          echo "quality jobs 全部成功"

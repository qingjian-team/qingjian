# 质量趋势、文档链接、feature 组合与 release 测试。
# 与 ci.yml 互补：那边管“编得过、测试过、依赖合规”，这里管“坏写法不增长、文档不断链、
# feature 组合不炸、release 下行为一致”。所有 action 与 ci.yml 一样钉 commit。
name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 纯 Python、秒级：新 PR 里多一个 unwrap/unsafe/todo!，这里第一眼就红。
  code-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quality baseline
        run: python3 tools/ci/quality_gate.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: target/quality-report.md
          if-no-files-found: ignore

  # 文档改名/删文件后，站内链接不会自己报错；构建时也不一定检查相对路径。
  docs-links:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docs links
        run: python3 tools/ci/check_docs_links.py

  # 默认 native-tls、安卓 rustls，两条路径单独都有 job；同时打开两者没有。
  # async-openai / reqwest 的 feature 组合冲突只会在“都开”时暴露。
  features:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Check all features
        run: cargo check -p qingjian-predict --all-features --locked

  # debug_assert! 在 release 下消失，它引用的变量会变成未使用；#[cfg(debug_assertions)]
  # 两侧的模块更是两份代码。现有的 release job 只跑 clippy，不跑测试。
  release-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Test core (release profile)
        run: cargo test --release -p qingjian-core --locked
